[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-knowledge-base"
version = "1.0.0"
description = "Retrieval-ready code patterns for small LLMs"
readme = "README.md"
authors = [
    { name = "LLM Knowledge Base Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.4.0",
]
mcp = [
    "mcp>=0.1.0",
]
jinja2 = [
    "jinja2>=3.0",
]
ollama = [
    "httpx>=0.25",
]

[project.scripts]
llm-kb = "llm_kb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_kb*"]

[tool.setuptools.package-data]
llm_kb = ["data/**/*.md"]

[tool.pytest.ini_options]
markers = [
    "smoke: fast CLI/package entrypoint checks; no external LLM calls",
    "sanity: small deterministic retrieval/API sanity checks; no external LLM calls",
    "regression: broad quality, retrieval, e2e, and profile regression tests",
    "mcp: MCP server/tool tests; requires the mcp extra",
    "slow: stress, performance, benchmark, or adversarial tests excluded from fast CI",
    "external: optional external-provider/network tests; never part of PR fast path",
]
norecursedirs = [
    "designing-multiagent-systems",
    "references",
]
